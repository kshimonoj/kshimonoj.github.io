<div style="position:relative;width:100%;aspect-ratio:16/9;margin:1.5em 0;">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}"
          style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px;"
          title="YouTube video"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
</div>
