<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ '/assets/favicon/og-image.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/favicon/og-image.png' | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <!-- Favicon -->
  <link rel="icon" href="{{ '/assets/favicon/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-brand">
        {% include k-mark.svg %}
        <span class="nav-brandname">Keita Shimono</span>
      </a>
      <div class="nav-right">
        <a href="{{ '/projects' | relative_url }}">Projects</a>
        <a href="{{ '/blog' | relative_url }}">Blog</a>
        <a href="https://github.com/kshimonoj" target="_blank" rel="noopener">GitHub ↗</a>
        <button class="theme-toggle" id="themeToggle" aria-label="テーマを切り替える">
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="site-footer">
    <p>© 2026 Keita Shimono ·
      <a href="https://github.com/kshimonoj">github.com/kshimonoj</a>
    </p>
  </footer>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
